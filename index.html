${libUI()}
<details open><summary>Template, style & backup</summary><div class="g"><label>Template<select data-k="tpl"><option value="modern" ${S.tpl=="modern"?"selected":""}>Modern (ROQ redesign)</option><option value="classic" ${S.tpl=="classic"?"selected":""}>Classic (Word style)</option></select></label><label>Font<select data-k="font">${FONTS.map(f=>`<option ${f==S.font?"selected":""}>${f}</option>`).join("")}</select></label><label>Main color<input type="color" data-k="c1" value="${S.c1}"></label><label>Accent color<input type="color" data-k="c2" value="${S.c2}"></label>${F("Header right, line 1 ({ref})","hdr1")}${F("Header right, line 2 ({date})","hdr2")}${F("Footer text","ftr")}${F("Contact line (letter)","contact")}</div><div class="row" style="padding-bottom:12px"><button data-bk="x">Backup (.json)</button><button data-bk="i">Restore backup</button><button data-bk="l">Remove logo</button><input type="file" id="bkf" accept=".json" style="display:none"></div></details>
<details open><summary>Client & quote</summary><div class="g">${F("Client","client")}${F("Attn / contact name","attn")}${F("Address / location","address")}${F("Client contact (phone)","phone")}${F("Client email","email")}${F("Subject (blank = auto: "+V.ro+")","subject")}${F("Interest / equipment (cover)","interest")}${F("Date","date","date")}${F("Ref prefix","prefix")}${F("Serial no.","serial")}<label>Quote Ref (auto)<input value="${e(V.ref)}" disabled></label>${F("Valid for (days)","validDays","number")}<label>Valid until (auto)<input value="${fd(V.valid?addD(S.date,S.validDays):"")}" disabled></label>
<label>Currency<select data-k="cur"><option ${S.cur=="USD"?"selected":""}>USD</option><option ${S.cur=="AED"?"selected":""}>AED</option></select></label>${F("VAT %","vat","number")}<label>Show AED equivalent (USD only)<select data-k="showAED" data-b="1"><option value="1" ${S.showAED?"selected":""}>Yes</option><option value="0" ${S.showAED?"":"selected"}>No</option></select></label>${F("USD→AED rate","rate","number",'step="0.0001"')}</div></details>
<details open><summary>Design basis (auto-fills specs)</summary><div class="g">${F("Capacity (GPD)","cap","number")}${F("Stages","stages","number")}${F("Raw water TDS (ppm)","feed","number")}${F("Recovery","rec")}${F("Permeate TDS < (ppm)","ptds","number")}</div></details>
<details open><summary>Commercial terms</summary><div class="g">${F("Advance payment %","adv","number")}<label>Balance % (auto)<input value="${100-S.adv}" disabled></label>${F("Delivery period","delp")}${F("Delivery place","dplace")}${F("Signatory","signName")}${F("Title","signTitle")}<label>Logo<input type="file" accept="image/*" id="lgf"></label></div></details>
<details open><summary>Pricing options (each has its own totals)</summary>${S.opts.map((o,oi)=>`<div class="op"><div class="row"><input data-o="${oi}" data-f="name" value="${e(o.name)}" placeholder="Option name"><button class="sm" data-rm="${oi}">Remove option</button></div>${o.items.map((i,k)=>`<div class="it"><label class="w">Product<input data-o="${oi}" data-i="${k}" data-f="d" value="${e(i.d)}"></label><label class="w">Specification ({ro} = auto capacity, **bold**)<input data-o="${oi}" data-i="${k}" data-f="s" value="${e(i.s)}"></label><label>Qty<input type="number" data-o="${oi}" data-i="${k}" data-f="q" value="${i.q}"></label><label>Unit price (${S.cur})<input type="number" step="0.01" data-o="${oi}" data-i="${k}" data-f="p" value="${i.p}"></label>${o.items.length>1?`<button class="sm" data-ri="${oi}.${k}">Remove item</button>`:""}</div>`).join("")}<div class="row"><button class="sm" data-ai="${oi}">+ Item</button></div><div class="tt tot" data-o="${oi}"></div></div>`).join("")}<button data-ao="1">+ Add option</button></details>
<details><summary>Water analysis values</summary><div class="g">${WA.map((r,i)=>`<label>${r[0]} (${r[1]})<input data-w="${i}" value="${e(S.water[i])}"></label>`).join("")}</div></details>
<details><summary>Standard text (auto-filled, editable) — use {client} {ro} {cur} {valid} {adv} {bal} {delp} {dplace}</summary><div class="g" style="grid-template-columns:1fr">${Object.keys(T).map(k=>`<label>${T[k][0]}<textarea data-t="${k}">${e(S.txt[k])}</textarea></label>`).join("")}<button data-rt="1">Reset all standard text to default</button></div></details>`;prev()}
document.addEventListener("input",ev=>{const t=ev.target,d=t.dataset;if(!d)return;let sv=1;
if(d.k){S[d.k]=t.type=="number"?(t.value===""?"":+t.value):d.b?t.value=="1":t.value;if(d.k=="cur")return save(),edit()}
else if(d.w!==undefined)S.water[+d.w]=t.value;else if(d.t)S.txt[d.t]=t.value;
else if(d.f){const o=S.opts[+d.o];if(d.i!==undefined)o.items[+d.i][d.f]=t.type=="number"?+t.value:t.value;else o[d.f]=t.value}else sv=0;
if(sv){save();prev();if(d.k=="date"||d.k=="validDays"||d.k=="prefix"||d.k=="serial"||d.k=="adv"){const a=document.activeElement;const p=a.selectionStart;edit();const n=document.querySelector(`[data-k="${d.k}"]`);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}}});
document.addEventListener("click",ev=>{const d=ev.target.dataset;if(!d)return;let ch=1;
if(d.rm!==undefined){if(S.opts.length>1)S.opts.splice(+d.rm,1)}else if(d.ri){const[a,b]=d.ri.split(".");S.opts[+a].items.splice(+b,1)}
else if(d.ai!==undefined)S.opts[+d.ai].items.push({d:"RO Unit",s:"{ro}",q:1,p:0});else if(d.ao)S.opts.push({name:"Option "+(S.opts.length+1),items:[{d:"RO Unit",s:"{ro}",q:1,p:0}]});
else if(d.rt){if(confirm("Reset all standard text?"))S.txt=mk().txt}else ch=0;if(ch){save();edit()}});
$("#ed").addEventListener("change",ev=>{if(ev.target.id!="lgf")return;const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;save();prev()};r.readAsDataURL(f)});
const show=p=>{$("#ed").style.display=p?"none":"block";$("#pv").style.display=p?"block":"none";$("#te").className=p?"":"on";$("#tp").className=p?"on":"";if(p){prev();$("#ms").textContent="Pink lines = print page breaks"}else $("#ms").textContent=""};
$("#te").onclick=()=>show(0);$("#tp").onclick=()=>show(1);
$("#nw").onclick=()=>{if(!confirm("Start a new quote? Client, date and prices reset; the serial number increments."))return;const n=mk(),s=+S.serial+1;S=Object.assign(n,{serial:String(isNaN(s)?S.serial:s),client:"",attn:"",address:"",logo:S.logo,txt:S.txt,rate:S.rate,signName:S.signName,signTitle:S.signTitle,water:WA.map(()=>"")});S.opts.forEach(o=>o.items.forEach(i=>i.p=0));save();edit();show(0)};
$("#pr").onclick=()=>{show(1);setTimeout(()=>window.print(),150)};
const CSS=()=>[...document.styleSheets[0].cssRules].map(r=>r.cssText).filter(t=>/\.doc|\.m |\.cd|@page/.test(t)&&!/@media print/.test(t)).join("");
$("#dl").onclick=async()=>{const ms=$("#ms"),html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Quotation ${e(V.ref)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins&family=Montserrat&family=Roboto&family=Lato&display=swap"><style>${CSS()}.doc .pg{box-shadow:none;margin:0 auto}</style></head><body><div class="doc ${S.tpl=="modern"?"m":"c"}" style="${dstyle()}">${build()}</div></body></html>`;
dsave(`Quotation_${V.ref}.html`,new Blob([html],{type:"text/html"}),html)};
edit();
</script>
  

</body></html>
